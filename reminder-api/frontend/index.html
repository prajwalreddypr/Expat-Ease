<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reminder App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; justify-content: center; padding: 40px 16px;
    }
    .app { width: 100%; max-width: 560px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: #94a3b8; margin: 0 0 24px; font-size: .9rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    label { display: block; font-size: .8rem; color: #94a3b8; margin: 10px 0 4px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: .95rem;
    }
    button {
      margin-top: 14px; width: 100%; padding: 11px; border: none; border-radius: 8px;
      background: #6366f1; color: white; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    button:disabled { opacity: .5; cursor: default; }
    .item {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    .item:last-child { border-bottom: none; }
    .item .msg { flex: 1; }
    .item .when { font-size: .78rem; color: #94a3b8; }
    .badge { font-size: .72rem; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
    .pending { background: #422006; color: #fbbf24; }
    .fired { background: #052e1a; color: #34d399; }
    .cancelled { background: #3b0d0d; color: #f87171; }
    .x { background: none; color: #94a3b8; width: auto; margin: 0; padding: 4px 8px; font-size: 1.1rem; }
    .x:hover { background: none; color: #f87171; }
    .empty { color: #64748b; text-align: center; padding: 16px 0; }
    .toprow { display: flex; justify-content: space-between; align-items: baseline; }
    .refresh { width: auto; margin: 0; padding: 6px 12px; font-size: .8rem; background: #334155; }
    .refresh:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="app">
    <h1>⏰ Reminder App</h1>
    <p class="sub">A tiny demo UI for the Reminder API. Reminders fire automatically when their time arrives — watch the badge turn green.</p>

    <div class="card">
      <label for="msg">Message</label>
      <input id="msg" placeholder="e.g. Call the landlord" />
      <label for="when">Remind me in (seconds from now)</label>
      <input id="when" type="number" value="10" min="1" />
      <button id="add">Add reminder</button>
    </div>

    <div class="card">
      <div class="toprow">
        <strong>Your reminders</strong>
        <button class="refresh" id="refresh">Refresh</button>
      </div>
      <div id="list"><p class="empty">Loading…</p></div>
    </div>
  </div>

  <script>
    // Hidden demo account so you don't have to deal with auth.
    const DEMO = { email: "demo@reminder.app", password: "demo12345" };
    let token = null;

    // When served by the API itself (http/https) use same-origin; in a file
    // preview (file:// or blob:) fall back to the local server's absolute URL.
    const API_BASE = location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8000";

    async function api(path, opts = {}) {
      const headers = opts.headers || {};
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(API_BASE + path, { ...opts, headers });
      if (!res.ok) throw new Error((await res.text()) || res.status);
      return res.status === 204 ? null : res.json();
    }

    async function ensureLogin() {
      // Register (ignore "already exists"), then log in.
      try {
        await fetch(API_BASE + "/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(DEMO),
        });
      } catch (_) {}
      const body = new URLSearchParams({ username: DEMO.email, password: DEMO.password });
      const data = await (await fetch(API_BASE + "/auth/login", { method: "POST", body })).json();
      token = data.access_token;
    }

    function fmt(iso) {
      return new Date(iso).toLocaleString();
    }

    async function load() {
      const list = document.getElementById("list");
      try {
        const items = await api("/reminders");
        if (!items.length) {
          list.innerHTML = '<p class="empty">No reminders yet — add one above.</p>';
          return;
        }
        list.innerHTML = items.map(r => `
          <div class="item">
            <div class="msg">
              <div>${escapeHtml(r.message)}</div>
              <div class="when">${fmt(r.remind_at)}</div>
            </div>
            <span class="badge ${r.status}">${r.status}</span>
            ${r.status === "pending" ? `<button class="x" data-id="${r.id}" title="Cancel">✕</button>` : ""}
          </div>
        `).join("");
        list.querySelectorAll(".x").forEach(b =>
          b.onclick = async () => { await api("/reminders/" + b.dataset.id, { method: "DELETE" }); load(); }
        );
      } catch (e) {
        list.innerHTML = '<p class="empty">Error: ' + escapeHtml(e.message) + "</p>";
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    document.getElementById("add").onclick = async () => {
      const msg = document.getElementById("msg").value.trim();
      const secs = parseInt(document.getElementById("when").value, 10) || 10;
      if (!msg) return;
      const remind_at = new Date(Date.now() + secs * 1000).toISOString();
      await api("/reminders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, remind_at }),
      });
      document.getElementById("msg").value = "";
      load();
    };

    document.getElementById("refresh").onclick = load;

    // Boot: log in, load, then auto-refresh every 2s so you see reminders fire.
    (async () => {
      await ensureLogin();
      await load();
      setInterval(load, 2000);
    })();
  </script>
</body>
</html>
